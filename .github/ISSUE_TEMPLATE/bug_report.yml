name: Bug report
description: Something did not work the way the README says it does
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. **Please do not paste your notes, or attach an index folder.** Counts, versions and the tool's own messages are all we need. If a note is needed to show the bug, write a small invented one.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: I ran `vault-mirror sync` after renaming a note and expected "renamed 1", but ...
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran, and what it printed
      description: Copy the command and the tool's output. Replace any note name you would rather not share.
      render: text
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `vault-mirror status`
      description: Counts and versions only. No note text.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: Output of `vault-mirror doctor`
      render: text
  - type: input
    id: version
    attributes:
      label: vault-mirror version
      description: "`vault-mirror --version`"
      placeholder: 0.1.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS, Apple Silicon
        - macOS, Intel
        - Windows x64
        - Windows on ARM
        - Linux x64
        - Linux arm64
        - Other
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: "`node --version`"
      placeholder: v24.15.0
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Roughly how big is the vault?
      description: The two counts from `status` are enough.
      placeholder: about 1,200 notes, 18,000 passages
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed any private note text and note names from what I pasted above.
          required: true
