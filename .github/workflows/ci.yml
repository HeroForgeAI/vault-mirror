name: CI

# test:        unit tests, type check and lint. They need no network and no reading model.
#              macOS is the verified platform and decides the result. Linux and Windows run too,
#              but are not verified yet, so a failure there is shown and does not fail the workflow.
# acceptance:  the end-to-end script on macOS: the read-only checks, a kill -9 in the middle of a
#              sync, two syncs racing. It downloads the reading model once and caches it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Remove a platform from this condition once it has a green run on record.
    continue-on-error: ${{ matrix.os != 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      # Never --omit=optional: the native engine is an optional package.
      - run: npm ci
      # The glob is left to bash, so the same line works on every Node version in the matrix.
      - name: Unit tests
        run: node --test tests/unit/*.test.js
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  acceptance:
    name: Acceptance, macOS, Node 22
    runs-on: macos-latest
    timeout-minutes: 30
    # This job has not yet run on a hosted runner, and some of its steps have time limits that were
    # set on a faster machine. Until it has one green run on record it reports without failing the
    # workflow. Delete the next line after that run, so the badge covers it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - name: Cache the reading model
        uses: actions/cache@v6
        with:
          path: ~/.ruvector/models
          key: reading-model-${{ hashFiles('src/embed/models.js') }}
      - run: npm ci
      - name: Doctor (loads the native engine; downloads the reading model on a cache miss)
        run: node bin/vault-mirror.js doctor
      - name: Acceptance (end to end on the invented fixture vault)
        run: node tests/acceptance/run.mjs --vault tests/fixtures/vault
