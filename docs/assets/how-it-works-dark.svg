<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How vault-mirror works</title>
  <desc id="d">Your vault feeds vault-mirror, which only reads it. vault-mirror keeps an index on this computer in step with the vault. Your AI sends a question to the index and gets short passages back. Every result names the note, the heading and the line, so your AI opens only what it needs.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#9198a1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#ab7df8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <!-- the four boxes -->
  <g stroke-width="2" fill="#151b23">
    <rect x="2" y="12" width="182" height="124" rx="14" stroke="#3d444d"/>
    <rect x="229" y="12" width="182" height="124" rx="14" stroke="#ab7df8" stroke-width="2.5"/>
    <rect x="456" y="12" width="182" height="124" rx="14" stroke="#3d444d"/>
    <rect x="456" y="236" width="182" height="124" rx="14" stroke="#3d444d"/>
  </g>
  <g text-anchor="middle" fill="#f0f6fc" font-size="24" font-weight="700">
    <text x="93" y="54">Your vault</text>
    <text x="320" y="54" fill="#ab7df8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">vault-mirror</text>
    <text x="547" y="54">The index</text>
    <text x="547" y="278">Your AI</text>
  </g>
  <g text-anchor="middle" fill="#9198a1" font-size="18">
    <text x="93" y="86">plain .md notes</text>
    <text x="93" y="111">you read here</text>
    <text x="320" y="86">reads what changed</text>
    <text x="320" y="111">never edits a note</text>
    <text x="547" y="86">outside the vault</text>
    <text x="547" y="111">on this computer</text>
    <text x="547" y="310">Claude Code, Codex</text>
    <text x="547" y="335">searches first</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="#9198a1" stroke-width="2.2" stroke-linecap="round">
    <path d="M190 74H222" marker-end="url(#a)"/>
    <path d="M417 74H449" marker-end="url(#a)"/>
    <path d="M490 230V143" marker-end="url(#a)"/>
    <path d="M604 142V229" marker-end="url(#a)"/>
  </g>
  <g fill="#9198a1" font-size="18">
    <text x="500" y="180">question</text>
    <text x="594" y="208" text-anchor="end">passages</text>
  </g>

  <!-- the link back, with its sentence in one piece above the line -->
  <g fill="#ab7df8" font-size="20" font-weight="700">
    <text x="112" y="204">Every result names the note,</text>
    <text x="112" y="232">the heading and the line, so</text>
    <text x="112" y="260">your AI opens only what it needs.</text>
  </g>
  <path d="M449 298H105Q93 298 93 286V144" fill="none" stroke="#ab7df8" stroke-width="2.4" stroke-linecap="round" marker-end="url(#b)"/>
</svg>
