<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How vault-mirror works</title>
  <desc id="d">Your vault feeds vault-mirror, which only reads it. vault-mirror keeps an index on this computer in step with the vault. Your AI sends a question to the index and gets short passages back. Every result names the note, the heading and the line, so your AI opens only what it needs.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#59636e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#8250df" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <!-- the four boxes -->
  <g stroke-width="1.5" fill="#f6f8fa">
    <rect x="8" y="12" width="190" height="124" rx="12" stroke="#d1d9e0"/>
    <rect x="265" y="12" width="190" height="124" rx="12" stroke="#8250df" stroke-width="2"/>
    <rect x="522" y="12" width="190" height="124" rx="12" stroke="#d1d9e0"/>
    <rect x="522" y="236" width="190" height="124" rx="12" stroke="#d1d9e0"/>
  </g>
  <g text-anchor="middle" fill="#1f2328" font-size="23" font-weight="700">
    <text x="103" y="54">Your vault</text>
    <text x="360" y="54" fill="#8250df" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">vault-mirror</text>
    <text x="617" y="54">The index</text>
    <text x="617" y="278">Your AI</text>
  </g>
  <g text-anchor="middle" fill="#59636e" font-size="17">
    <text x="103" y="86">plain .md notes</text>
    <text x="103" y="111">you read here</text>
    <text x="360" y="86">reads what changed</text>
    <text x="360" y="111">never edits a note</text>
    <text x="617" y="86">outside the vault</text>
    <text x="617" y="111">on this computer</text>
    <text x="617" y="310">Claude Code, Codex</text>
    <text x="617" y="335">searches first</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round">
    <path d="M204 74H258" marker-end="url(#a)"/>
    <path d="M461 74H515" marker-end="url(#a)"/>
    <path d="M584 230V143" marker-end="url(#a)"/>
    <path d="M626 142V229" marker-end="url(#a)"/>
  </g>
  <g fill="#59636e" font-size="16">
    <text x="231" y="62" text-anchor="middle">sync</text>
    <text x="488" y="62" text-anchor="middle">store</text>
    <text x="574" y="192" text-anchor="end">question</text>
    <text x="636" y="192">passages</text>
  </g>

  <!-- the link back -->
  <path d="M515 298H115Q103 298 103 286V144" fill="none" stroke="#8250df" stroke-width="2.2" stroke-linecap="round" marker-end="url(#b)"/>
  <g fill="#8250df" font-size="18" font-weight="700">
    <text x="128" y="238">Every result names the note,</text>
    <text x="128" y="263">the heading and the line,</text>
  </g>
  <text x="128" y="330" fill="#59636e" font-size="17">so your AI opens only what it needs.</text>
</svg>
